<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO -->
    <meta
      name="description"
      content="Jihed Dridi — Élève ingénieur Cloud Computing & DevOps. Portfolio professionnel spécialisé en Cloud, Kubernetes, GitOps, Azure, Docker, Terraform et CI/CD."
    />

    <meta
      name="keywords"
      content="Jihed Dridi, Cloud, DevOps, Kubernetes, Azure, GitOps, Docker, Terraform, GitLab CI/CD, Argo CD, Jenkins, OpenStack"
    />

    <meta name="author" content="Jihed Dridi" />
    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#081015" />

    <!-- Open Graph / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://jiheddridi.github.io/"
    />

    <meta
      property="og:title"
      content="Jihed Dridi — Cloud & DevOps"
    />

    <meta
      property="og:description"
      content="Portfolio de Jihed Dridi — Cloud Computing, DevOps, Kubernetes, GitOps, Azure et automatisation."
    />

    <meta
      property="og:image"
      content="https://jiheddridi.github.io/og-image.png"
    />

    <meta
      property="og:site_name"
      content="Jihed Dridi Portfolio"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Jihed Dridi — Cloud & DevOps"
    />

    <meta
      name="twitter:description"
      content="Portfolio Cloud & DevOps de Jihed Dridi."
    />

    <meta
      name="twitter:image"
      content="https://jiheddridi.github.io/og-image.png"
    />

    <!-- Language -->
    <meta name="google" content="notranslate" />

    <!-- Title -->
    <title>
      Jihed Dridi — Cloud & DevOps Portfolio
    </title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Prevent ugly white flash -->
    <style>
      html {
        background: #081015;
      }

      body {
        margin: 0;
        background: #081015;
        color: #ffffff;
        font-family: "DM Sans", sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      /* Loading screen */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #081015;
        transition: opacity 0.4s ease;
      }

      #app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loader-content {
        text-align: center;
      }

      .loader-name {
        margin-bottom: 16px;
        font-family: "Space Grotesk", sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      .loader-bar {
        width: 140px;
        height: 3px;
        overflow: hidden;
        margin: auto;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
      }

      .loader-progress {
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #ffffff;
        animation: loading 1.2s infinite ease-in-out;
      }

      @keyframes loading {
        0% {
          transform: translateX(-120%);
        }

        100% {
          transform: translateX(350%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- React application -->
    <div id="root"></div>

    <!-- Initial loading -->
    <div id="app-loader">
      <div class="loader-content">
        <div class="loader-name">
          JIHED DRIDI
        </div>

        <div class="loader-bar">
          <div class="loader-progress"></div>
        </div>
      </div>
    </div>

    <!-- Vite / React entry point -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Remove loader after React starts -->
    <script>
      window.addEventListener("load", () => {
        const loader = document.getElementById("app-loader");

        if (loader) {
          setTimeout(() => {
            loader.classList.add("hidden");

            setTimeout(() => {
              loader.remove();
            }, 500);
          }, 200);
        }
      });
    </script>
  </body>
</html>
